name: render

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    name: Render every example in both themes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@11.16.0
      - name: Render
        run: |
          printf '{"args":["--no-sandbox"]}\n' > "$RUNNER_TEMP/puppeteer.json"
          out="$RUNNER_TEMP/svg"
          mkdir -p "$out"
          mmdc --version
          missing=0
          for diagram in state sequence architecture logic journey; do
            for mode in light dark; do
              svg="$out/$diagram-$mode.svg"
              mmdc -q -p "$RUNNER_TEMP/puppeteer.json" -i "checks/$diagram.mmd" -o "$svg" \
                -c "assets/$mode.json" -b transparent || true
              if [ ! -s "$svg" ]; then
                echo "::error::missing $diagram-$mode.svg"
                missing=1
              fi
            done
          done
          ls "$out"
          exit "$missing"
